<ion-side-menus enable-menu-with-back-views="false">
  <ion-side-menu-content>
    <ion-nav-bar class="bar-ucsal">
      <ion-nav-back-button></ion-nav-back-button>
      <ion-nav-buttons side="left">
        <button class="button button-icon button-clear ion-navicon" menu-toggle="left" aria-label="Abrir menu"></button>
      </ion-nav-buttons>
    </ion-nav-bar>
    <ion-nav-view name="menuContent"></ion-nav-view>
  </ion-side-menu-content>

  <ion-side-menu side="left" expose-aside-when="large">
    <ion-header-bar class="bar-ucsal">
      <h1 class="title">UCSal</h1>
    </ion-header-bar>
    <ion-content>
      <div class="menu-aluno">
        <strong>{{ aluno.nome }}</strong>
        <span>Matrícula {{ aluno.matricula }}</span>
      </div>
      <nav class="list">
        <a class="item item-icon-left" menu-close href="#/app/noticias">
          <i class="icon ion-ios-paper-outline"></i> Mural
        </a>
        <a class="item item-icon-left" menu-close href="#/app/perfil">
          <i class="icon ion-ios-person-outline"></i> Meus dados
        </a>
        <a class="item item-icon-left" menu-close href="#/app/financeiro">
          <i class="icon ion-card"></i> Financeiro
        </a>
        <a class="item item-icon-left" menu-close href="" ng-click="sair()">
          <i class="icon ion-log-out"></i> Sair
        </a>
      </nav>
    </ion-content>
  </ion-side-menu>
</ion-side-menus>
